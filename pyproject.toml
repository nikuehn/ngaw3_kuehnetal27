[project]
name = "ngaw3_kuehnetal27"
version = "0.1.0"
dependencies = [
    "numpyro",
    "equinox",
    "pyproj",
    "pyrvt",
]

[project.optional-dependencies]
jax-cpu = ["jax", "jaxlib"]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
ngaw3_kuehnetal27 = ["data/*.csv", "data/*.nc", "results/**/*.json", 
                     "results/**/*.gz", "results/**/*.csv"]

[tool.setuptools]
include-package-data = true
